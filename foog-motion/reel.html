<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>FOOG Kick-off</title>
<style>
  @font-face { font-family: A; src: url(fonts/a900.woff2) format('woff2'); font-weight: 900; }
  @font-face { font-family: A; src: url(fonts/a700.woff2) format('woff2'); font-weight: 700; }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #0D1226; }
  #root, svg { display: block; width: 1920px; height: 1080px; }
</style>
</head>
<body>
<div id="root"></div>
<script>
// FOOG «Kick-off» – 15 s, 120 BPM. Har bir kadr faqat t dan hisoblanadi: window.seek(t).
const W = 1920, H = 1080, CX = 960, CY = 540, DUR = 15, BEAT = 0.5;
const COL = { m: '#0D1226', v: '#C8F53A', b: '#3D6BFF', w: '#FFFFFF', k: '#000000' };

// ------------------------------------------------------------ yengil matematika
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const prog = (t, a, d) => clamp((t - a) / d);
const eo = (x) => (x >= 1 ? 1 : 1 - Math.pow(2, -10 * x));            // eksponensial chiqish
const ei = (x) => (x <= 0 ? 0 : Math.pow(2, 10 * (x - 1)) - 0.001 * (1 - x)); // eksponensial kirish
const eio = (x) => (x <= 0 ? 0 : x >= 1 ? 1 : x < 0.5 ? Math.pow(2, 20 * x - 10) / 2 : (2 - Math.pow(2, -20 * x + 10)) / 2);
// kritik so‘nuvchi prujina – oshib ketmaydi (bouncy emas)
const spr = (t, a, w = 16) => (t <= a ? 0 : 1 - (1 + w * (t - a)) * Math.exp(-w * (t - a)));
const f2 = (n) => Math.round(n * 100) / 100;
const deg = Math.PI / 180;

// ------------------------------------------------------------ harakat xiraligi (tezlik va yo‘nalish bo‘yicha)
let DEFS = [], FID = 0;
const HSTEP = 1 / 120;
/** fn(t) -> [x,y]; ekran px/kadr (60fps) tezlikka mos yo‘nalishli blur filtri */
function mb(fn, t, gain = 0.45, max = 60) {
  const a = fn(t - HSTEP), b = fn(t + HSTEP);
  const vx = Math.abs(b[0] - a[0]), vy = Math.abs(b[1] - a[1]);
  const sx = Math.min(max, vx * gain), sy = Math.min(max, vy * gain);
  if (sx < 0.4 && sy < 0.4) return '';
  const id = 'mb' + FID++;
  DEFS.push(`<filter id="${id}" x="-60%" y="-60%" width="220%" height="220%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="${f2(sx)} ${f2(sy)}"/></filter>`);
  return ` filter="url(#${id})"`;
}
function clip(inner) { const id = 'c' + FID++; DEFS.push(`<clipPath id="${id}">${inner}</clipPath>`); return ` clip-path="url(#${id})"`; }

// ------------------------------------------------------------ matn o‘lchash (bir marta, deterministik)
const cvs = document.createElement('canvas').getContext('2d');
const ADV = new Map();
function adv(str, size, wt) {
  const key = str + '|' + size + '|' + wt;
  if (!ADV.has(key)) { cvs.font = `${wt} ${size}px A`; ADV.set(key, [...str].map((ch) => cvs.measureText(ch).width)); }
  return ADV.get(key);
}
/** harflarni joylash: markaz bo‘yicha; har harf uchun {x, w, ch} */
function layout(str, size, wt = 900, track = -0.035) {
  const a = adv(str, size, wt), tr = track * size;
  const total = a.reduce((s, x) => s + x, 0) + tr * (a.length - 1);
  let x = -total / 2; const out = [];
  [...str].forEach((ch, i) => { out.push({ ch, x, w: a[i], cx: x + a[i] / 2 }); x += a[i] + tr; });
  return { letters: out, width: total };
}
const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');
const txt = (s, x, y, size, fill, wt = 900, anchor = 'start', extra = '') => `<text x="${f2(x)}" y="${f2(y)}" font-family="A" font-weight="${wt}" font-size="${size}" fill="${fill}" text-anchor="${anchor}"${extra}>${esc(s)}</text>`;

// ------------------------------------------------------------ shakllar: SDF + nur bo‘yicha namunalash (morf uchun)
const N = 180;
function polar(sdf, cx = CX, cy = CY) {
  const pts = [];
  for (let i = 0; i < N; i++) {
    const a = -Math.PI / 2 + (i / N) * Math.PI * 2, dx = Math.cos(a), dy = Math.sin(a);
    let lo = 0, hi = 1500;
    for (let k = 0; k < 24; k++) { const m = (lo + hi) / 2; if (sdf(cx + dx * m, cy + dy * m) < 0) lo = m; else hi = m; }
    pts.push([cx + dx * lo, cy + dy * lo]);
  }
  return pts;
}
const sdCircle = (cx, cy, r) => (x, y) => Math.hypot(x - cx, y - cy) - r;
const sdRBox = (cx, cy, hw, hh, r) => (x, y) => {
  const qx = Math.abs(x - cx) - hw + r, qy = Math.abs(y - cy) - hh + r;
  return Math.hypot(Math.max(qx, 0), Math.max(qy, 0)) + Math.min(Math.max(qx, qy), 0) - r;
};
function sdTri(p, a, b, c) { // iq sdTriangle
  const e0 = [b[0] - a[0], b[1] - a[1]], e1 = [c[0] - b[0], c[1] - b[1]], e2 = [a[0] - c[0], a[1] - c[1]];
  const v0 = [p[0] - a[0], p[1] - a[1]], v1 = [p[0] - b[0], p[1] - b[1]], v2 = [p[0] - c[0], p[1] - c[1]];
  const pq = (v, e) => { const h = clamp((v[0] * e[0] + v[1] * e[1]) / (e[0] * e[0] + e[1] * e[1])); return [v[0] - e[0] * h, v[1] - e[1] * h]; };
  const q0 = pq(v0, e0), q1 = pq(v1, e1), q2 = pq(v2, e2);
  const s = Math.sign(e0[0] * e2[1] - e0[1] * e2[0]);
  const d0 = [q0[0] * q0[0] + q0[1] * q0[1], s * (v0[0] * e0[1] - v0[1] * e0[0])];
  const d1 = [q1[0] * q1[0] + q1[1] * q1[1], s * (v1[0] * e1[1] - v1[1] * e1[0])];
  const d2 = [q2[0] * q2[0] + q2[1] * q2[1], s * (v2[0] * e2[1] - v2[1] * e2[0])];
  const d = [Math.min(d0[0], d1[0], d2[0]), Math.min(d0[1], d1[1], d2[1])];
  return -Math.sqrt(d[0]) * Math.sign(d[1]);
}
const sdPin = (x, y) => Math.min(sdCircle(CX, 450, 170)(x, y), sdTri([x, y], [CX - 150, 530], [CX + 150, 530], [CX, 800]));
const lerpPts = (A, B, k) => A.map((p, i) => [lerp(p[0], B[i][0], k), lerp(p[1], B[i][1], k)]);
const pathOf = (pts, close = true) => 'M' + pts.map((p) => f2(p[0]) + ' ' + f2(p[1])).join('L') + (close ? 'Z' : '');
const SH = {}; // shakllar bir marta hisoblanadi (t ga bog‘liq emas)
function shapes() {
  if (SH.ready) return SH;
  SH.c180 = polar(sdCircle(CX, CY, 180)); SH.c200 = polar(sdCircle(CX, CY, 200));
  SH.pin = polar(sdPin); SH.pitch = polar(sdRBox(CX, CY, 500, 310, 26)); SH.ready = true;
  return SH;
}

// ------------------------------------------------------------ logotip (FoogMark geometriyasi)
const LS = 2.6;                       // logotip masshtabi
const LU = (u, v) => [CX + (u - 241) * LS, CY + (v - 60) * LS];
// O harfining o‘rta chizig‘i: tekis tomon + yoy; 4 bo‘lak: tepa 30, o‘ng 40, past 30, yoy 80 nuqta
function dMid(mirror) {
  const pts = [];
  const seg = (a, b, n) => { for (let i = 0; i < n; i++) pts.push([lerp(a[0], b[0], i / n), lerp(a[1], b[1], i / n)]); };
  seg([174, 11], [218, 11], 30); seg([218, 11], [218, 109], 40); seg([218, 109], [174, 109], 30);
  for (let i = 0; i < 80; i++) { const a = Math.PI / 2 + (i / 80) * Math.PI; pts.push([174 + 49 * Math.cos(a), 60 + 49 * Math.sin(a)]); }
  return pts.map(([u, v]) => LU(mirror ? 468 - u : u, v));
}
// jarima maydonchasi: tepa, ichki tomon, past, darvoza chizig‘i
function boxPts(mirror) {
  const pts = []; const x0 = 180, x1 = 440, y0 = CY - 230, y1 = CY + 230;
  const seg = (a, b, n) => { for (let i = 0; i < n; i++) pts.push([lerp(a[0], b[0], i / n), lerp(a[1], b[1], i / n)]); };
  seg([x0, y0], [x1, y0], 30); seg([x1, y0], [x1, y1], 40); seg([x1, y1], [x0, y1], 30); seg([x0, y1], [x0, y0], 80);
  return pts.map(([x, y]) => [mirror ? 2 * CX - x : x, y]);
}
const DL = dMid(false), DR = dMid(true), BL = boxPts(false), BR = boxPts(true);

function logo({ fx = 0, gx = 0, dk = 0, dlx = 0, drx = 0, gap = 1, url = 0, t }) {
  let s = '';
  const g = (dx, inner, fnPos) => `<g${mb(fnPos, t)} transform="translate(${f2(dx)} 0)"><g transform="translate(${f2(CX - 241 * LS)} ${f2(CY - 60 * LS)}) scale(${LS})">${inner}</g></g>`;
  // F
  s += g(fx, `<path d="M0 120 V60 A60 60 0 0 1 60 0 H100 V22 H60 A38 38 0 0 0 22 60 V120 Z" fill="${COL.w}"/><rect x="22" y="56" width="54" height="22" fill="${COL.w}"/>`, (tt) => [logoFX(tt), 0]);
  // G
  s += g(gx, `<rect x="360" y="0" width="122" height="120" fill="${COL.w}" mask="url(#gmask)"/>`, (tt) => [logoGX(tt), 0]);
  // ikkita O: o‘rta chiziq ko‘rinishida (morf qilinadi)
  const sw = lerp(22 * LS, 12, dk);
  const A = lerpPts(DL, BL, dk).map((p) => [p[0] + dlx, p[1]]), B = lerpPts(DR, BR, dk).map((p) => [p[0] + drx, p[1]]);
  s += `<path d="${pathOf(A)}" fill="none" stroke="${COL.v}" stroke-width="${f2(sw)}" stroke-linejoin="miter" stroke-miterlimit="8"${mb((tt) => [dPos(tt).l, 0], t)}/>`;
  s += `<path d="${pathOf(B)}" fill="none" stroke="${COL.v}" stroke-width="${f2(sw)}" stroke-linejoin="miter" stroke-miterlimit="8"${mb((tt) => [dPos(tt).r, 0], t)}/>`;
  if (gap > 0.001) s += `<circle cx="${CX}" cy="${CY}" r="${f2(20 * LS * gap)}" fill="${COL.m}"/>`;
  // foog.uz
  if (url < 1) {
    const y = 812 + url * 90;
    s += `<g${clip(`<rect x="0" y="752" width="${W}" height="80"/>`)}><g${mb((tt) => [0, urlY(tt)], t)}>${txt('foog.uz', CX, y, 54, COL.w, 700, 'middle', ' letter-spacing="1"')}</g></g>`;
  }
  return s;
}
// logotip qismlari vaqt funksiyalari (boshi va oxiri bir xil – aylanib takrorlanadi)
function logoFX(t) { return t < 7 ? -1500 * ei(prog(t, 0, 0.44)) : -1500 * (1 - eo(prog(t, 14.25, 0.52))); }
function logoGX(t) { return -logoFX(t); }
function urlY(t) { return t < 7 ? ei(prog(t, 0, 0.36)) : 1 - eo(prog(t, 14.5, 0.38)); }
function dPos(t) {
  if (t < 7) return { l: 0, r: 0 };
  const k = 1 - eo(prog(t, 14.0, 0.45));
  return { l: -1300 * k, r: 1300 * k };
}

// ------------------------------------------------------------ 3D proyeksiya (bitta kamera)
function proj(x, y, z, c) {
  const cy_ = Math.cos(c.yaw), sy_ = Math.sin(c.yaw);
  const x1 = x * cy_ - y * sy_, y1 = x * sy_ + y * cy_;
  const cp = Math.cos(c.phi), sp = Math.sin(c.phi);
  const y2 = y1 * cp - z * sp, z2 = y1 * sp + z * cp;
  const d = c.D - z2;
  return [c.ox + (c.f * x1 / d) * c.s, c.oy + (c.f * y2 / d) * c.s, d];
}
// maydon chiziqlari (dunyo koordinatalari, maydon 1000×620)
const PHW = 500, PHH = 310;
function pitchLines() {
  const L = [];
  const line = (pts) => L.push(pts);
  const seg = (a, b, n = 12) => { const p = []; for (let i = 0; i <= n; i++) p.push([lerp(a[0], b[0], i / n), lerp(a[1], b[1], i / n)]); return p; };
  line(seg([0, -PHH], [0, PHH], 16));
  const circ = []; for (let i = 0; i <= 48; i++) { const a = -Math.PI / 2 + (i / 48) * Math.PI * 2; circ.push([90 * Math.cos(a), 90 * Math.sin(a)]); } line(circ);
  for (const s of [-1, 1]) {
    line([...seg([s * PHW, -160], [s * (PHW - 160), -160], 6), ...seg([s * (PHW - 160), -160], [s * (PHW - 160), 160], 10).slice(1), ...seg([s * (PHW - 160), 160], [s * PHW, 160], 6).slice(1)]);
    line([...seg([s * PHW, -70], [s * (PHW - 60), -70], 3), ...seg([s * (PHW - 60), -70], [s * (PHW - 60), 70], 4).slice(1), ...seg([s * (PHW - 60), 70], [s * PHW, 70], 3).slice(1)]);
  }
  return L;
}
const PL = pitchLines();
const polyLen = (p) => p.reduce((s, q, i) => (i ? s + Math.hypot(q[0] - p[i - 1][0], q[1] - p[i - 1][1]) : 0), 0);

// ================================================================ SAHNALAR
// 1 · HOOK (0–2): logotip maydonga aylanadi, kamera nuqtaga sho‘ng‘iydi
function s1(t) {
  const dk = eo(prog(t, 0.5, 0.45));
  const draw = eo(prog(t, 1.0, 0.45));
  const z = Math.exp(Math.log(80) * ei(prog(t, 1.5, 0.5))) * lerp(1, 1.05, prog(t, 1.0, 0.5));
  let s = `<rect width="${W}" height="${H}" fill="${COL.m}"/>`;
  s += `<g transform="translate(${CX} ${CY}) scale(${f2(z * 1000) / 1000}) translate(${-CX} ${-CY})">`;
  // maydon chiziqlari: markazdan tashqariga chiziladi
  if (draw > 0) {
    const L = (pts) => { const len = polyLen(pts); return `<path d="${pathOf(pts, false)}" fill="none" stroke="${COL.w}" stroke-width="12" stroke-dasharray="${f2(len)}" stroke-dashoffset="${f2(len * (1 - draw))}" stroke-linecap="butt"/>`; };
    const top = [[CX, 100], [180, 100], [180, CY]], bot = [[CX, 980], [180, 980], [180, CY]];
    s += L(top) + L(bot) + L(top.map(([x, y]) => [2 * CX - x, y])) + L(bot.map(([x, y]) => [2 * CX - x, y]));
    s += L([[CX, CY - 52], [CX, 100]]) + L([[CX, CY + 52], [CX, 980]]);
    const r = 170, circ = 2 * Math.PI * r;
    s += `<circle cx="${CX}" cy="${CY}" r="${r}" fill="none" stroke="${COL.w}" stroke-width="12" stroke-dasharray="${f2(circ)}" stroke-dashoffset="${f2(circ * (1 - draw))}" transform="rotate(-90 ${CX} ${CY})"/>`;
  }
  s += logo({ fx: logoFX(t), gx: logoGX(t), dk, gap: 1 - dk, url: urlY(t), t });
  s += `<circle cx="${CX}" cy="${CY}" r="${f2(11 * LS)}" fill="${COL.b}"/>`;
  s += `</g>`;
  return s;
}

// 2 · KINETIK MATN (2–4)
function s2(t) {
  let s = `<rect width="${W}" height="${H}" fill="${COL.b}"/>`;
  const SZ = 300, CAP = 0.72 * SZ;
  const pan1 = -2300 * eio(prog(t, 3.0, 0.4));
  const pan2 = -2300 * eio(prog(t, 3.5, 0.3));
  const panAt = (tt) => -2300 * eio(prog(tt, 3.0, 0.4)) - 2300 * eio(prog(tt, 3.5, 0.3));
  const X = pan1 + pan2;
  // harflarni pastdan ko‘taruvchi qator
  const rise = (str, baseFn, x0, at, fill, size = SZ) => {
    const lay = layout(str, size);
    let out = '';
    lay.letters.forEach((L, i) => {
      const a = at + i * 0.028;
      const dy = (tt) => (1 - eo(prog(tt, a, 0.34))) * size * 1.05;
      const y = baseFn(t) + dy(t);
      const fx = (tt) => [x0 + panAt(tt) + L.x, baseFn(tt) + dy(tt)];
      out += `<g${mb(fx, t)}>${txt(L.ch, x0 + X + L.x, y, size, fill)}</g>`;
    });
    const top = baseFn(t) - size * 0.78, h = size * 0.98;
    return `<g${clip(`<rect x="0" y="${f2(top)}" width="${W}" height="${f2(h)}"/>`)}>${out}</g>`;
  };
  const b1 = (tt) => lerp(540 + CAP / 2, 400 + CAP / 2, eo(prog(tt, 2.5, 0.34)));
  const b2 = () => 680 + CAP / 2;
  s += rise('STADION', b1, CX, 2.0, COL.w);
  if (t >= 2.5) s += rise('TOP.', b2, CX, 2.5, COL.v);
  if (t >= 2.95) {
    s += rise('JAMOA', () => 400 + CAP / 2, CX + 2300, 2.98, COL.w);
    s += rise('YIG‘', () => 680 + CAP / 2, CX + 2300, 3.06, COL.v);
  }
  if (t >= 3.45) {
    // O‘YNA: "O" – Volt doira, keyin markazga o‘tib shaklga aylanadi
    const SZ2 = 380, CAP2 = 0.72 * SZ2, base = 540 + CAP2 / 2;
    const lay = layout('O‘YNA', SZ2);
    const x0 = CX + 4600;
    const drop = (tt) => ei(prog(tt, 3.78, 0.22)) * 800;
    lay.letters.forEach((L, i) => {
      if (i === 0) return;
      const a = 3.5 + i * 0.03;
      const dy = (tt) => (1 - eo(prog(tt, a, 0.28))) * SZ2 * 1.05 + drop(tt);
      const fx = (tt) => [x0 + panAt(tt) + L.x, base + dy(tt)];
      s += `<g${mb(fx, t)}>${txt(L.ch, x0 + X + L.x, base + dy(t), SZ2, COL.w)}</g>`;
    });
    const o = lay.letters[0];
    const oPos = (tt) => {
      const k = eo(prog(tt, 3.78, 0.22));
      const px = x0 + panAt(tt) + o.cx, py = base - CAP2 / 2;
      return [lerp(px, CX, k), lerp(py, CY, k)];
    };
    const r = lerp(CAP2 / 2, 180, eo(prog(t, 3.78, 0.22))) * eo(prog(t, 3.5, 0.25));
    const p = oPos(t);
    s += `<circle cx="${f2(p[0])}" cy="${f2(p[1])}" r="${f2(r)}" fill="${COL.v}"${mb(oPos, t)}/>`;
  }
  return s;
}

// 3 · SHAKL MORFI (4–6): doira → koptok → pin → maydon
function s3(t) {
  const S = shapes();
  let s = `<rect width="${W}" height="${H}" fill="${COL.b}"/>`;
  const k1 = eo(prog(t, 4.0, 0.35)), k2 = eo(prog(t, 4.5, 0.4)), k3 = eo(prog(t, 5.0, 0.4)), k4 = eo(prog(t, 5.5, 0.4));
  let pts = lerpPts(S.c180, S.c200, k1);
  if (t >= 4.5) pts = lerpPts(S.c200, S.pin, k2);
  if (t >= 5.0) pts = lerpPts(S.pin, S.pitch, k3);
  const rot = t < 5.0 ? -24 * eo(prog(t, 4.0, 0.9)) : -24 * (1 - eo(prog(t, 5.0, 0.4)));
  s += `<g transform="rotate(${f2(rot)} ${CX} ${CY})"><path d="${pathOf(pts)}" fill="${COL.v}"/>`;
  // koptok naqshi: chiziladi, keyin yig‘iladi
  const pat = k1 * (1 - eo(prog(t, 4.5, 0.16)));
  if (pat > 0.002) {
    const pent = []; for (let i = 0; i < 5; i++) { const a = -Math.PI / 2 + (i / 5) * Math.PI * 2; pent.push([CX + 62 * Math.cos(a), CY + 62 * Math.sin(a)]); }
    s += `<path d="${pathOf(pent)}" fill="${COL.m}" transform="translate(${CX} ${CY}) scale(${f2(pat)}) translate(${-CX} ${-CY})"/>`;
    pent.forEach(([x, y]) => {
      const dx = x - CX, dy = y - CY, l = Math.hypot(dx, dy);
      const ex = CX + (dx / l) * 200, ey = CY + (dy / l) * 200;
      s += `<line x1="${f2(x)}" y1="${f2(y)}" x2="${f2(lerp(x, ex, pat))}" y2="${f2(lerp(y, ey, pat))}" stroke="${COL.m}" stroke-width="14" stroke-linecap="round"/>`;
    });
  }
  s += `</g>`;
  // pin teshigi
  const hole = t < 5.0 ? k2 : 1 - k3;
  if (hole > 0.002 && t >= 4.5) s += `<circle cx="${CX}" cy="450" r="${f2(72 * hole)}" fill="${COL.b}"/>`;
  // maydon chiziqlari chiziladi
  if (k4 > 0) {
    const cam = { phi: 0, yaw: 0, D: 1400, f: 1400, s: 1, ox: CX, oy: CY };
    PL.forEach((pl) => {
      const P = pl.map(([x, y]) => proj(x, y, 0, cam)), len = polyLen(P);
      s += `<path d="${pathOf(P, false)}" fill="none" stroke="${COL.m}" stroke-width="8" stroke-dasharray="${f2(len)}" stroke-dashoffset="${f2(len * (1 - k4))}"/>`;
    });
  }
  return s;
}

// 4 · 2D → 3D (6–8)
function cam4(t) {
  const tilt = eo(prog(t, 6.0, 0.5)) * (1 - eio(prog(t, 7.5, 0.45)));
  const yaw = -25 * eio(prog(t, 7.0, 0.5)) - 65 * eio(prog(t, 7.5, 0.45));
  return { phi: 62 * deg * tilt, yaw: yaw * deg, D: 1400, f: 1400, s: lerp(1, 0.8, eio(prog(t, 7.5, 0.45))), ox: CX, oy: CY + 70 * tilt };
}
function pitch3D(t, cam, lineCol, lineW, fill, draw = 1) {
  let s = '';
  const C = [[-PHW, -PHH], [PHW, -PHH], [PHW, PHH], [-PHW, PHH]].map(([x, y]) => proj(x, y, 0, cam));
  if (fill) s += `<path d="${pathOf(C)}" fill="${fill}"/>`;
  PL.forEach((pl) => {
    const P = pl.map(([x, y]) => proj(x, y, 0, cam)), len = polyLen(P);

// 7 · ENG KUCHLI TAKT (12–14)
