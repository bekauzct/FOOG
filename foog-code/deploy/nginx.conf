# /etc/nginx/sites-available/foog.uz  – bitta domen: sayt, API, fayllar va WebSocket
server {
  listen 80;
  server_name foog.uz www.foog.uz;
  return 301 https://foog.uz$request_uri;
}
server {
  listen 443 ssl http2;
  server_name foog.uz;
  ssl_certificate     /etc/letsencrypt/live/foog.uz/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/foog.uz/privkey.pem;
  client_max_body_size 200m;   # reel videolari uchun

  # Real vaqt (chat, bildirishnoma, bron holati)
  location /ws {
    proxy_pass http://127.0.0.1:4000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
  }
  # API, Telegram webhook va yuklangan fayllar to‘g‘ridan-to‘g‘ri API ga
  location ~ ^/(api/v1|uploads|telegram/webhook|health) {
    proxy_pass http://127.0.0.1:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  # Next.js sayt
  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
